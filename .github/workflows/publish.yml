name: Publish to NPM

on:
  workflow_dispatch:
  push:
    tags:
      # Release Please tags the root package on every release.
      - 'cspell-dicts@*'

permissions:
  contents: read
  id-token: write

# Queue runs instead of running two publishes at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      # The release PR bumps versions but not the READMEs, so regenerate them for the versions being published,
      # such as the CDN links' major version. The Update README workflow brings the same change to `main`.
      - name: Build Readme
        run: pnpm run build:readme

      # Release Please has already incremented versions and published tags, so we just
      # need to publish all unpublished versions to NPM here
      # See: https://github.com/lerna/lerna/tree/main/commands/publish#bump-from-package
      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{secrets.PUBLISH_NPM}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        # Prerelease versions, such as 3.2.0-alpha.0, go to the `alpha` dist-tag, so `latest` doesn't change.
        run: pnpm lerna publish from-package --no-push --no-private --pre-dist-tag alpha --yes
