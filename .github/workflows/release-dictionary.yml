name: ' 📦 Set Dictionary Version release-as'

# Opens a PR that sets a package's `release-as`, so Release Please releases it at that version next.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name, such as @cspell/dict-perl'
        type: string
        required: true
      version:
        description: 'Version to release, such as 1.0.0 or 3.2.0-alpha.0'
        type: string
      remove-release-as:
        description: "Remove the package's release-as instead (the version is ignored)"
        type: boolean
        default: false
      ref:
        description: 'Branch to run against and open the PR into'
        type: string
        default: main

permissions:
  contents: read

jobs:
  release-as:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
      REMOVE: ${{ inputs.remove-release-as }}
      REF_BRANCH: ${{ inputs.ref || 'main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.REF_BRANCH }}

      - name: Setup
        uses: ./.github/actions/quick-setup

      - name: Install
        run: pnpm i

      - name: Set or remove release-as
        id: change
        run: |
          if [[ "$REMOVE" == "true" ]]; then
            pnpm run release-as --remove "$PACKAGE"
            echo "message=chore: remove release-as for $PACKAGE" >> "$GITHUB_OUTPUT"
            echo "body=Removes \`release-as\` for \`$PACKAGE\` in \`release-please-config.json\`." >> "$GITHUB_OUTPUT"
          elif [[ -z "$VERSION" ]]; then
            echo "::error::Give a version, or check remove-release-as."
            exit 1
          else
            pnpm run release-as --version "$VERSION" "$PACKAGE"
            echo "message=chore: set release-as for $PACKAGE to $VERSION" >> "$GITHUB_OUTPUT"
            echo "body=Sets \`release-as\` to \`$VERSION\` for \`$PACKAGE\` in \`release-please-config.json\`." >> "$GITHUB_OUTPUT"
          fi

      - name: PR
        uses: ./.github/actions/pr
        with:
          commit-message: ${{ steps.change.outputs.message }}
          branch: release-dictionary
          base: ${{ env.REF_BRANCH }}
          body: ${{ steps.change.outputs.body }}
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
