name: ' 🚀 release-please'

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Run one at a time. Cancelling a run in progress can leave a release half done.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    steps:
      # An App token, so the tags Release Please pushes start the Publish to NPM workflow.
      - id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # After a release, the config script drops each `release-as` whose version is now in the manifest.
      - name: Checkout code
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        if: ${{ steps.release.outputs.releases_created }}
        uses: ./.github/actions/quick-setup

      - name: Update the Release Please config
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          pnpm i
          pnpm run gen:release-please-config

      - name: PR
        if: ${{ steps.release.outputs.releases_created }}
        uses: ./.github/actions/pr
        with:
          commit-message: 'chore: update the Release Please config after a release'
          branch: release-please-config
          base: main
          body: |
            Removes `release-as` from packages that have now been released at that version.
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

# cspell:ignore noreply
