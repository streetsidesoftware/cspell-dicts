packages:
  - cspell-dict-file-checker
  - dictionaries/*
  - dictionaries/*/scripts
  - packages/*
  - scripts

minimumReleaseAge: 2880 # two days
minimumReleaseAgeExclude:
  - '@cspell/*'
  - 'cspell'
  - 'cspell-*'
  - hunspell-reader
  - inject-markdown
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@5.7.2
  - mem-fs-editor@12.0.6

# cspell:dictionaries npm
